name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows}
          - {os: macos-latest, name: macOS}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-web.txt pyinstaller
      - run: pyinstaller --noconfirm --distpath dist --workpath build packaging/scope_tool_web.spec
      - name: 檢查動態載入的模組有進包
        shell: bash
        run: |
          for m in i2c_decode i3c_decode spi_decode uart_decode can_decode espi_decode usbpd_decode; do
            grep -rq "scope_tool.web.$m" build/ || { echo "缺 $m"; exit 1; }
          done
          grep -rq "scope_tool.instruments.infiniivision" build/ || { echo "缺 infiniivision"; exit 1; }
      - name: 打包 (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/scope_tool_web -DestinationPath ScopeView-Windows.zip
      - name: 打包 (macOS，ad-hoc 簽章)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - dist/*.app
          ditto -c -k --keepParent dist/*.app ScopeView-macOS.zip
      - uses: actions/upload-artifact@v4
        with: {name: "ScopeView-${{ matrix.name }}", path: "ScopeView-*.zip"}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: {files: "ScopeView-*.zip"}
