name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows}
          - {os: macos-latest, name: macOS}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install -r requirements-web.txt pyinstaller
      - name: 打包前自檢
        shell: bash
        run: |
          fail=0
          run() { "$@" || { echo "自檢失敗：$*"; fail=1; }; }
          run python -B -m scope_tool.web.decimate
          run python -B -m scope_tool.web.jobs
          run python -B -m scope_tool.web.api
          run python -B -m scope_tool.web.server
          run python -B -m scope_tool.web.analysis_api
          run python -B -m scope_tool.web.analysis_slots
          run python -B -m scope_tool.web.e2e_check
          run python -B -m scope_tool.storage.writer
          run python -B -m scope_tool.storage.reader
          run python -B -m scope_tool.storage.csv_export
          run python -B -m scope_tool.web.i2c_real_check
          run python -B -m scope_tool.web.espi_check
          run python -B -m scope_tool.web.spi_check
          run python -B -m scope_tool.instruments.base
          run python -B -m scope_tool.instruments.infiniivision
          run python -B -m scope_tool.instruments.infiniium
          run node scope_tool/web/static/js/selfcheck_node.js
          exit $fail
      - run: pyinstaller --noconfirm --distpath dist --workpath build packaging/scope_tool_web.spec
      - name: 檢查動態載入的模組有進包
        shell: bash
        run: |
          set -eo pipefail
          EXE=dist/scope_tool_web/scope_tool_web
          if [ "$RUNNER_OS" = Windows ]; then EXE="$EXE.exe"; fi
          if ! pyi-archive_viewer --list --recursive --brief "$EXE" | tr -d '\r' | tee archive_list.txt; then
            pyi-archive_viewer -l build/scope_tool_web/PYZ-00.pyz | tr -d '\r' | tee archive_list.txt
          fi
          for m in scope_tool.web.i2c_decode scope_tool.web.i3c_decode scope_tool.web.spi_decode scope_tool.web.uart_decode scope_tool.web.can_decode scope_tool.web.espi_decode scope_tool.web.usbpd_decode scope_tool.instruments.infiniivision scope_tool.instruments.infiniium scope_tool.web.server; do
            grep -Eq "(^|[[:space:]])${m//./\\.}$" archive_list.txt || { echo "缺 $m"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "archive-list-${{ matrix.name }}", path: archive_list.txt}
      - name: 打包 (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/scope_tool_web -DestinationPath ScopeView-Windows.zip
      - name: 打包 (macOS，ad-hoc 簽章)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - dist/*.app
          ditto -c -k --keepParent dist/*.app ScopeView-macOS.zip
      - uses: actions/upload-artifact@v4
        with: {name: "ScopeView-${{ matrix.name }}", path: "ScopeView-*.zip"}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: {files: "ScopeView-*.zip"}
