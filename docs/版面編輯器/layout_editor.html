<header class="toolbar">
<h1>離線分析版面編輯器</h1>
<label>畫布 <select id="preset"><option value="2000x1290">2000×1290</option><option value="1400x900">1400×900</option><option value="1000x800">1000×800（窄版）</option></select></label>
<label>縮放 <select id="zoom"><option value="fit">適應視窗</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option></select></label>
<label><input type="checkbox" id="snap" checked>吸附格線</label><input type="number" id="grid-size" value="8" min="2" max="100" aria-label="格線大小">
<label><input type="checkbox" id="guides" checked>對齊輔助線</label>
<label><input type="checkbox" id="group-move" checked>拖容器時帶子部件</label>
<label><input type="checkbox" id="show-shot" checked>顯示真實畫面</label>
<label><input type="checkbox" id="show-hidden">顯示隱藏部件（虛線）</label>
<span class="divider"></span><button id="btn-reset">載入現況版面</button><button id="btn-undo" disabled>復原</button><button id="btn-redo" disabled>重做</button><button id="btn-import">匯入 JSON</button><input id="import-file" type="file" accept=".json,application/json" hidden><button id="btn-export" class="primary">輸出</button>
<span id="save-status" role="status"></span>
</header>
<main class="main">
<aside class="panel left"><div class="panel-title"><h2>部件清單</h2><span id="component-count" class="hint"></span></div><div id="comp-list" role="tree" aria-label="部件清單"></div></aside>
<section class="stage"><div class="stage-head"><span id="canvas-info"></span><span>方向鍵微調 · Shift 加速 · Alt 暫停吸附</span></div><div class="viewport" id="viewport"><div id="canvas-wrap"><div id="canvas" aria-label="版面畫布"></div></div></div></section>
<aside class="panel right"><div class="panel-title"><h2>屬性面板</h2><span class="hint">座標單位：px</span></div><div class="properties"><p id="empty-selection" class="hint">點選畫布或清單中的部件</p><div id="selected-properties" hidden>
<h3 id="prop-name"></h3><div class="metadata"><div id="prop-id" class="mono"></div><div id="prop-group"></div><div id="prop-parent"></div><div id="prop-files" class="files mono"></div><div id="prop-rule" class="rule"></div></div>
<div class="fields"><div class="field"><label for="prop-x">X 位置</label><input id="prop-x" type="number" step="any"><output id="pct-x"></output></div><div class="field"><label for="prop-y">Y 位置</label><input id="prop-y" type="number" step="any"><output id="pct-y"></output></div><div class="field"><label for="prop-w">寬度</label><input id="prop-w" type="number" min="8" step="any"><output id="pct-w"></output></div><div class="field"><label for="prop-h">高度</label><input id="prop-h" type="number" min="8" step="any"><output id="pct-h"></output></div></div>
<div class="baseline"><div id="prop-baseline"></div><button id="prop-revert">此部件還原為現況</button></div><div class="checks"><label><input id="prop-visible" type="checkbox">顯示</label><label><input id="prop-locked" type="checkbox">鎖定</label></div>
<div>疊放順序 <span id="prop-z" class="mono"></span></div><div class="z-buttons"><button id="z-top">最上層</button><button id="z-up">上移一層</button><button id="z-down">下移一層</button><button id="z-bottom">最下層</button></div>
<label for="prop-note" class="note-label">註解</label><textarea id="prop-note" rows="6" placeholder="例：希望寬度 300px、放在主圖右側；字體放大；為什麼這樣放…"></textarea>
</div></div><div class="global"><label class="note-label" for="global-note">全域註解</label><textarea id="global-note" rows="4" placeholder="整體想法：例如希望量測欄改到右邊、結果區更高…"></textarea></div></aside>
</main>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">載入現況版面</h2><p id="confirm-message"></p><div class="dialog-actions"><button id="confirm-cancel">取消</button><button id="confirm-ok" class="primary">確定</button></div></dialog>
<dialog id="preset-dialog" aria-labelledby="preset-title"><h2 id="preset-title">切換畫布尺寸</h2><p id="preset-message"></p><div class="dialog-actions"><button id="preset-cancel">取消</button><button id="preset-keep">保留目前位置（超出畫布的會夾回）</button><button id="preset-load" class="primary">載入此尺寸的現況（保留註解）</button></div></dialog>
<dialog id="export-dialog" aria-labelledby="export-title"><h2 id="export-title">輸出版面修改需求</h2><div class="export-heading"><label for="export-json">layout.json</label><div><button id="copy-json">複製</button><button id="download-json">下載</button></div></div><textarea id="export-json" readonly></textarea><div class="export-heading"><label for="export-md">Markdown 摘要</label><div><button id="copy-md">複製</button><button id="download-md">下載</button></div></div><textarea id="export-md" readonly></textarea><div class="dialog-actions"><button id="export-close" class="primary">關閉</button></div></dialog>

  if (Object.hasOwn(raw,'note')) {if(typeof raw.note !== 'string') throw new Error('註解必須是文字'); r.note=raw.note;}
  if (Object.hasOwn(raw,'z')) {if(!Number.isSafeInteger(raw.z)) throw new Error('疊放順序必須是整數'); r.z=raw.z;}

}

  },300);
}

function updateHistory() {$('btn-undo').disabled=!history.length; $('btn-redo').disabled=!future.length;}
function record(before) {
  if(JSON.stringify(before)===JSON.stringify(state)) return;
  history.push(clone(before)); if(history.length>200) history.shift(); future.length=0; updateHistory(); scheduleSave();
}
function flushNotes() {clearTimeout(noteTimer); if(noteBefore) {const before=noteBefore; noteBefore=null; record(before);}}
function action(fn) {flushNotes(); const before=clone(state); fn(); record(before); render();}
function undo() {flushNotes(); if(!history.length) return; future.push(clone(state)); state=history.pop(); render(); scheduleSave();}
function redo() {flushNotes(); if(!future.length) return; history.push(clone(state)); state=future.pop(); render(); scheduleSave();}
function toast(message) {clearTimeout(toastTimer); const host=document.querySelector('dialog[open]')||document.body; host.append($('toast')); $('toast').textContent=message; toastTimer=setTimeout(() => {$('toast').textContent='';},3000);}
function el(tag, className, text) {const node=document.createElement(tag); if(className) node.className=className; if(text!==undefined) node.textContent=text; return node;}
function depth(c) {let n=0; while(c.parent && definitions.has(c.parent)) {n++; c=definitions.get(c.parent);} return n;}
function renderList() {
  const fragment=document.createDocumentFragment();

  zoom=$('zoom').value==='fit'?Math.max(.05,Math.min(1,(viewport.clientWidth-48)/w,(viewport.clientHeight-48)/h)):Number($('zoom').value);

function renderCanvas() {

  for(const c of DATA.components) if(!excluded.includes(c.id) && state.items[c.id].visible) {const r=state.items[c.id],p=axis==='x'?r.x:r.y,s=axis==='x'?r.w:r.h; values.push(p,p+s/2,p+s);}
  return values;
}
function snapAxis(start,end,axis,mode,excluded,alt) {
  if(alt) return {start,end};
  const anchors=mode==='move'?[[start,1],[ (start+end)/2,1],[end,1]]:mode==='start'?[[start,1],[(start+end)/2,.5]]:mode==='end'?[[end,1],[(start+end)/2,.5]]:[];
  let match=null;
  if($('guides').checked) for(const target of targets(axis,excluded)) for(const [anchor,factor] of anchors) {const distance=Math.abs(target-anchor)*zoom; if(distance<=6 && (!match || distance<match.distance)) match={target,delta:(target-anchor)/factor,distance};}
  if(match) {
    if(mode==='move') {start+=match.delta; end+=match.delta;} else if(mode==='start') start+=match.delta; else if(mode==='end') end+=match.delta;
    return {start,end,guide:match.target};
  }
  if($('snap').checked) {const grid=gridSize(); if(mode==='move') {const delta=Math.round(start/grid)*grid-start; start+=delta; end+=delta;} else if(mode==='start') start=Math.round(start/grid)*grid; else if(mode==='end') end=Math.round(end/grid)*grid;}
  return {start,end};
}
function pointerStart(event) {
  if(event.button!==0 || drag) return;
  const handle=event.target.closest('.handle[data-handle]')?.dataset.handle || '',node=event.target.closest('.comp');
  const id=handle?selected:node?.dataset.id;
  if(!id) {if(event.target===$('canvas')) select(null); return;}
  event.preventDefault();
  select(id); if(state.items[id].locked) return;
  const ids=handle?[id]:movingIds(id);
  drag={id,handle,ids,before:clone(state),px:event.clientX,py:event.clientY,pointer:event.pointerId};
  $('canvas').setPointerCapture(event.pointerId);
}
function pointerMove(event) {
  if(!drag || drag.pointer!==event.pointerId) return;
  const d=drag,r=d.before.items[d.id],dx=(event.clientX-d.px)/zoom,dy=(event.clientY-d.py)/zoom,{w,h}=size();
  let left=r.x,top=r.y,right=r.x+r.w,bottom=r.y+r.h;
  const modeX=d.handle?(d.handle.includes('w')?'start':d.handle.includes('e')?'end':'none'):'move';
  const modeY=d.handle?(d.handle.includes('n')?'start':d.handle.includes('s')?'end':'none'):'move';
  if(!d.handle) {left+=dx; right+=dx; top+=dy; bottom+=dy;} else {if(modeX==='start') left=clamp(left+dx,0,right-8); if(modeX==='end') right=clamp(right+dx,left+8,w); if(modeY==='start') top=clamp(top+dy,0,bottom-8); if(modeY==='end') bottom=clamp(bottom+dy,top+8,h);}
  const sx=snapAxis(left,right,'x',modeX,d.ids,event.altKey),sy=snapAxis(top,bottom,'y',modeY,d.ids,event.altKey);
  if(!d.handle) moveFrom(d.before,d.ids,sx.start-r.x,sy.start-r.y);
  else {
    left=modeX==='start'?clamp(sx.start,0,right-8):left; right=modeX==='end'?clamp(sx.end,left+8,w):right;
    top=modeY==='start'?clamp(sy.start,0,bottom-8):top; bottom=modeY==='end'?clamp(sy.end,top+8,h):bottom;
    Object.assign(state.items[d.id],bound({...state.items[d.id],x:left,y:top,w:right-left,h:bottom-top}));
  }
  guideLines=[]; const current=state.items[d.id];
  for(const [axis,snap] of [['x',sx],['y',sy]]) if(snap.guide!==undefined) {const p=axis==='x'?current.x:current.y,s=axis==='x'?current.w:current.h; if([p,p+s/2,p+s].some(n=>Math.abs(n-snap.guide)<.01)) guideLines.push({axis,value:snap.guide});}
  renderCanvas(); renderProperties(); scheduleSave();
}
function pointerEnd(event,cancel=false) {
  if(!drag || drag.pointer!==event.pointerId) return;
  const d=drag; drag=null; if(cancel) {state=d.before; scheduleSave();} else record(d.before);
  if($('canvas').hasPointerCapture(event.pointerId)) $('canvas').releasePointerCapture(event.pointerId);
  guideLines=[]; render();
}
function resetFor(preset) {const next=baseline(preset); next.globalNote=state.globalNote; for(const c of DATA.components) next.items[c.id].note=state.items[c.id].note; state=next;}
function reorder(where) {if(!selected) return; action(()=>{const ids=ordered().map(c=>c.id),i=ids.indexOf(selected); const dest=where==='top'?ids.length-1:where==='bottom'?0:clamp(i+(where==='up'?1:-1),0,ids.length-1); if(dest===i) return; ids.splice(i,1); ids.splice(dest,0,selected); ids.forEach((id,z)=>{state.items[id].z=z;});});}
function noteInput(global) {
  if(!global && !selected) return;
  if(!noteBefore) noteBefore=clone(state);
  if(global) state.globalNote=$('global-note').value; else state.items[selected].note=$('prop-note').value;
  clearTimeout(noteTimer); noteTimer=setTimeout(flushNotes,800); scheduleSave(); renderList(); renderCanvas();
}
function importText(text) {
  try {
    const data=JSON.parse(text);
    if(!data || data.schema!=='scope-analysis-layout/1' || !data.canvas || !Object.hasOwn(DATA.presets,data.canvas.preset) || !Array.isArray(data.components)) throw new Error('請選擇本工具輸出的 layout.json');
    if(data.globalNote!==undefined && typeof data.globalNote!=='string') throw new Error('全域註解必須是文字');
    const next=baseline(data.canvas.preset); next.globalNote=data.globalNote||''; let unknown=0;
    for(const raw of data.components) {
      if(!raw || typeof raw!=='object' || typeof raw.id!=='string') throw new Error('部件缺少有效的 id');
      if(!definitions.has(raw.id)) {unknown++; continue;}
      const fallback={...next.items[raw.id],z:state.items[raw.id].z};
      next.items[raw.id]=validatedItem(raw,fallback,DATA.presets[next.preset]);
    }
    action(()=>{state=next;}); toast('匯入成功'+(unknown?'；略過 '+unknown+' 個未知部件':'')); return true;
  } catch(error) {toast('匯入失敗：'+error.message); return false;}
}
function localISO(date=new Date()) {const pad=n=>String(n).padStart(2,'0'), offset=-date.getTimezoneOffset(); return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())+'T'+pad(date.getHours())+':'+pad(date.getMinutes())+':'+pad(date.getSeconds())+(offset>=0?'+':'-')+pad(Math.floor(Math.abs(offset)/60))+':'+pad(Math.abs(offset)%60);}
function stamp(date) {const pad=n=>String(n).padStart(2,'0'); return date.getFullYear()+pad(date.getMonth()+1)+pad(date.getDate())+'_'+pad(date.getHours())+pad(date.getMinutes())+pad(date.getSeconds());}
function pct(rect) {const {w,h}=size(); return Object.fromEntries(['x','y','w','h'].map(k=>[k,Math.round(rect[k]/(['x','w'].includes(k)?w:h)*10000)/100]));}
function exportObject(time=localISO()) {
  const {w,h}=size();
  return {schema:'scope-analysis-layout/1',exportedAt:time,canvas:{preset:state.preset,width:w,height:h},globalNote:state.globalNote,source:DATA.source,components:ordered().map(c=>{
    const r=state.items[c.id],b=c.rects[state.preset],z=baseIndex.get(c.id),baseline={x:b.x,y:b.y,w:b.w,h:b.h,visible:b.visible,z};
    return {id:c.id,name:c.name,group:c.group,parent:c.parent,module:(c.files.find(f=>f.endsWith('.js'))||c.files[0]||'').split('/').pop(),files:clone(c.files),x:r.x,y:r.y,w:r.w,h:r.h,pct:pct(r),z:r.z,visible:r.visible,locked:r.locked,note:r.note,baseline,changed:['x','y','w','h'].some(k=>Math.abs(r[k]-b[k])>=1)||r.visible!==b.visible||r.z!==z};
  })};
}
function exportJSON() {return JSON.stringify(exportObject(),null,2);}
function markdown(data=exportObject()) {
  const show=v=>v?'顯示':'隱藏',rect=r=>'('+r.x+', '+r.y+') '+r.w+'×'+r.h;
  const changed=data.components.filter(c=>c.changed), notes=data.components.filter(c=>!c.changed && c.note.length>0), rest=data.components.filter(c=>!c.changed && !c.note.length);
  const changedById=new Map(changed.map(c=>[c.id,c])), owners=new Map(), translated=new Map();
  function sectionOwner(c) {
    if(owners.has(c.id)) return owners.get(c.id);
    const b=c.baseline, parent=changedById.get(c.parent);
    const followsParent=parent && !c.note.length && c.w===b.w && c.h===b.h && c.visible===b.visible && c.z===b.z && c.locked===(b.locked??false)
      && c.x-b.x===parent.x-parent.baseline.x && c.y-b.y===parent.y-parent.baseline.y;
    const owner=followsParent?sectionOwner(parent):c.id;
    owners.set(c.id,owner); return owner;
  }
  for(const c of changed) {
    const owner=sectionOwner(c);
    if(owner!==c.id) {if(!translated.has(owner)) translated.set(owner,[]); translated.get(owner).push(c);}
  }
  const listed=changed.filter(c=>sectionOwner(c)===c.id);
  const movedCount=data.components.filter(c=>c.x!==c.baseline.x || c.y!==c.baseline.y).length;
  const lines=['# 離線分析版面修改需求','','- 輸出時間：'+data.exportedAt,'- 畫布：'+data.canvas.width+'×'+data.canvas.height+'（preset '+data.canvas.preset+'）','- 座標：CSS px，畫布左上為原點；現況來源：'+data.source,'- 注意：現有版面是 CSS grid＋`layout.js` 的 `clampLayout` 動態計算，請依註解意圖修改尺寸／停靠規則，不要把座標寫死。','','## 全域註解',data.globalNote||'（無）',''];
  function detail(c,hasChange) {
    const b=c.baseline, bp=pct(b), definition=definitions.get(c.id);
    lines.push('### '+c.group+' › '+c.name+'（`'+c.id+'`）');
    if(hasChange) {const deltas=['x','y','w','h'].filter(k=>c[k]-b[k]!==0).map(k=>{const n=Math.round((c[k]-b[k])*100)/100; return 'Δ'+k+' '+(n>0?'+':'')+n;}); lines.push('- 位置／尺寸：'+rect(b)+' → '+rect(c)+(deltas.length?'（'+deltas.join('、')+'）':''));}
    else lines.push('- 位置／尺寸：'+rect(c)+'（未變）');
    lines.push('- 百分比：'+['x','y','w','h'].map(k=>k+' '+bp[k].toFixed(2)+'%→'+c.pct[k].toFixed(2)+'%').join('、'));
    if(c.visible!==b.visible) lines.push('- 可見性：'+show(b.visible)+' → '+show(c.visible));
    if(c.z!==b.z) lines.push('- 疊放順序：z '+b.z+' → '+c.z);
    if(c.locked) lines.push('- 鎖定：是');
    if(translated.has(c.id)) lines.push('- 子部件隨容器一起平移：'+translated.get(c.id).map(child=>child.name+'（`'+child.id+'`）').join('、'));
    lines.push('- 註解：');
    lines.push(...(c.note?c.note.split(/\r\n|\n|\r/).map(line=>'  > '+line):['  （無註解）']));
    lines.push('- 建議修改檔案：'+c.files.map(f=>'`'+f+'`').join('、'),'- 現況規則：'+definition.rule,'');
  }
  lines.push('## 有變更的部件（'+listed.length+'）','共有 '+movedCount+' 個部件位置有變（含隨容器平移的子部件）。',''); if(!listed.length) lines.push('（無）',''); else listed.forEach(c=>detail(c,true));
  lines.push('## 只有註解、位置未變的部件（'+notes.length+'）'); if(!notes.length) lines.push('（無）',''); else notes.forEach(c=>detail(c,false));
  lines.push('## 未變更的部件（'+rest.length+'）'); if(!rest.length) lines.push('（無）'); else rest.forEach(c=>lines.push('- '+c.name+'（`'+c.id+'`）：'+rect(c)+'，'+show(c.visible)));
  return lines.join('\n')+'\n';
}
function exportMarkdown() {return markdown();}
async function copyText(id) {
  const field=$(id); let success=false;
  try {if(navigator.clipboard?.writeText) {await navigator.clipboard.writeText(field.value); success=true;}} catch { /* 剪貼簿受限時改用頁內選取。 */ }
  if(!success) {try {field.focus(); field.select(); success=document.execCommand('copy');} catch {success=false;}}
  toast(success?'已複製':'無法複製，請手動選取文字複製');
}
function download(id,kind) {
  const blob=new Blob([$(id).value],{type:kind==='json'?'application/json;charset=utf-8':'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),link=el('a');
  link.href=url; link.download=(kind==='json'?'layout_':'layout_summary_')+exportStamp+'.'+kind; document.body.append(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
// 事件委派避免重繪後遺失清單與畫布的互動。
$('comp-list').addEventListener('click',event=>{const row=event.target.closest('.row'); if(!row) return; const id=row.dataset.id,act=event.target.closest('button')?.dataset.act; select(id); if(act) action(()=>{const r=state.items[id]; if(act==='vis') r.visible=!r.visible; else r.locked=!r.locked;});});
$('comp-list').addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ') && event.target.classList.contains('row')) {event.preventDefault(); select(event.target.dataset.id);}});
$('canvas').addEventListener('pointerdown',pointerStart);
$('canvas').addEventListener('pointermove',pointerMove);
$('canvas').addEventListener('pointerup',event=>pointerEnd(event));

$('canvas').addEventListener('lostpointercapture',event=>{if(drag) pointerEnd(event);});
for(const key of ['x','y','w','h']) {
  const field=$('prop-'+key);
  const apply=()=>{if(!selected || state.items[selected].locked) return; const value=field.valueAsNumber; if(!Number.isFinite(value)) {renderProperties(); return;} action(()=>{const r=state.items[selected]; r[key]=Math.round(value); bound(r);});};
  field.addEventListener('change',apply); field.addEventListener('keydown',event=>{if(event.key==='Enter') {event.preventDefault(); apply();}});
}
$('prop-visible').addEventListener('change',()=>{if(selected) action(()=>{state.items[selected].visible=$('prop-visible').checked;});});
$('prop-locked').addEventListener('change',()=>{if(selected) action(()=>{state.items[selected].locked=$('prop-locked').checked;});});

for(const where of ['top','up','down','bottom']) $('z-'+where).addEventListener('click',()=>reorder(where));
$('prop-note').addEventListener('input',()=>noteInput(false)); $('global-note').addEventListener('input',()=>noteInput(true));
$('prop-note').addEventListener('blur',flushNotes); $('global-note').addEventListener('blur',flushNotes);
$('btn-undo').addEventListener('click',undo); $('btn-redo').addEventListener('click',redo);
$('btn-reset').addEventListener('click',()=>{flushNotes(); $('confirm-message').textContent='所有部件的位置、大小、可見性、z 順序與鎖定會重設為 '+state.preset+' 的現況；註解保留。'; $('confirm-dialog').showModal();});
$('confirm-cancel').addEventListener('click',()=>$('confirm-dialog').close());
$('confirm-ok').addEventListener('click',()=>{$('confirm-dialog').close(); action(()=>resetFor(state.preset));});
$('preset').addEventListener('change',()=>{flushNotes(); pendingPreset=$('preset').value; $('preset-message').textContent='選擇 '+pendingPreset+' 的版面處理方式。'; $('preset-dialog').showModal();});
function cancelPreset() {$('preset-dialog').close(); $('preset').value=state.preset; pendingPreset=null;}
$('preset-cancel').addEventListener('click',cancelPreset); $('preset-dialog').addEventListener('cancel',event=>{event.preventDefault(); cancelPreset();});
$('preset-load').addEventListener('click',()=>{const preset=pendingPreset; cancelPreset(); if(preset) action(()=>resetFor(preset));});
$('preset-keep').addEventListener('click',()=>{const preset=pendingPreset; cancelPreset(); if(preset) action(()=>{state.preset=preset; for(const c of DATA.components) bound(state.items[c.id]);});});
$('btn-import').addEventListener('click',()=>{$('import-file').value=''; $('import-file').click();});
$('import-file').addEventListener('change',()=>{const file=$('import-file').files[0]; if(!file) return; const reader=new FileReader(); reader.onload=()=>importText(String(reader.result)); reader.onerror=()=>toast('匯入失敗：無法讀取檔案'); reader.readAsText(file);});
$('btn-export').addEventListener('click',()=>{flushNotes(); const date=new Date(),data=exportObject(localISO(date)); exportStamp=stamp(date); $('export-json').value=JSON.stringify(data,null,2); $('export-md').value=markdown(data); $('export-dialog').showModal();});
$('copy-json').addEventListener('click',()=>copyText('export-json')); $('copy-md').addEventListener('click',()=>copyText('export-md'));
$('download-json').addEventListener('click',()=>download('export-json','json')); $('download-md').addEventListener('click',()=>download('export-md','md'));
$('export-close').addEventListener('click',()=>$('export-dialog').close());
for(const id of ['zoom','snap','show-shot','show-hidden','grid-size']) $(id).addEventListener('change',()=>{if(id==='grid-size') $('grid-size').value=gridSize(); fitCanvas(); renderCanvas();});
document.addEventListener('keydown',event=>{
  if(event.target.closest('input,textarea,select,[contenteditable=true]') || document.querySelector('dialog[open]')) return;
  const command=event.ctrlKey||event.metaKey,key=event.key.toLowerCase();
  if(command && (key==='z'||key==='y')) {event.preventDefault(); if(drag) return; if(key==='y'||event.shiftKey) redo(); else undo(); return;}

});
const viewportObserver=new ResizeObserver(()=>{fitCanvas(); renderCanvas();});
viewportObserver.observe($('viewport'));
window.addEventListener('resize',()=>{fitCanvas(); renderCanvas();});

window.__editor={state:()=>clone(state),baseline:preset=>clone(baseline(preset)),exportJSON,exportMarkdown,importText,select,undo,redo};
$('component-count').textContent=DATA.components.length+' 個部件';
render(); scheduleSave();
