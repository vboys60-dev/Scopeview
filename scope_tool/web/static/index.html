<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示波器工具</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/analysis.css">
<link rel="stylesheet" href="css/vertical.css">
<link rel="stylesheet" href="css/glass.css">
</head>
<body>
<!-- 舊版 WebView（例如缺 WebView2 時退成 IE11）不支援 ES modules：顯示安裝提示 -->
<div id="legacy-warning" class="legacy-warning" hidden></div>
<script nomodule>
  var w = document.getElementById("legacy-warning");
  w.hidden = false;
  w.textContent = "此瀏覽器元件過舊，無法執行本程式。請安裝 Microsoft Edge WebView2 Runtime（發行資料夾內附離線安裝檔）後重新開啟。";
</script>
<div class="app">
  <header id="connbar" class="connbar"></header>
  <nav id="tabs" class="tabs" role="tablist">
    <button class="tab tab--active" role="tab" data-tab="capture" aria-selected="true">資料截取</button>
    <button class="tab" role="tab" data-tab="analysis" aria-selected="false">離線分析</button>
    <button class="tab" role="tab" data-tab="fft" aria-selected="false">FFT 頻譜</button>
  </nav>
  <main class="pages">
    <section id="tab-capture" class="page" role="tabpanel"></section>
    <section id="tab-analysis" class="page" role="tabpanel" hidden></section>
    <section id="tab-fft" class="page" role="tabpanel" hidden></section>
  </main>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
